<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Применяем сохранённую тему до первого отображения страницы,
         чтобы не было вспышки светлого фона при запуске React. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('mekha_theme_mode') === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-mekha-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-mekha-theme', 'light');
        }
      })();
    </script>
    <style>html,body{background-color:#faf8f5;min-height:100%}html[data-mekha-theme=dark],html[data-mekha-theme=dark] body{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;background-color:#202630!important}html[data-mekha-theme=light],html[data-mekha-theme=light] body{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light;background-color:#faf8f5}</style>
    <title>Mekha Shop — Закупки и Учет</title>

    <!-- Иконка для вкладки в браузере (ПК и Android) -->
    <link rel="icon" type="image/png" href="./apple-touch-icon.png" />

    <!-- Иконка и PWA-настройки для iOS (iPhone) -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mekha Shop" />

    <!-- Манифест приложения -->
    <link rel="manifest" href="./manifest.json" />

    <script type="text/javascript">
      // Обработка перенаправления от 404.html
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
